# KataGo analysis-engine config -- see docs/KATAGO_ATTRIBUTION.md and
# docs/PLAN.md's Phase 0/2 findings.
#
# The original (Phase 0 spike) numSearchThreadsPerAnalysisThread=8 was
# tuned assuming this process has the whole CPU-only droplet to itself --
# true for a single game, guaranteed CPU oversubscription the instant a
# second concurrent game queries the same box. Since GamesTutor.Go.Engine
# (Phase 1) made this ONE process serving every concurrent game, thread
# counts are deliberately kept small and explicit rather than left to
# auto-scale to the vCPU count.
logDir = /tmp/katago_logs
reportAnalysisWinratesAs = SIDETOMOVE
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 2
# Matches numAnalysisThreads * numSearchThreadsPerAnalysisThread -- no
# benefit to a larger batch than the total thread count can ever fill.
nnMaxBatchSize = 2
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14
nnRandomize = true

# This app only ever plays 9x9 (see GamesTutor.Go.GameServer's
# @default_size) -- unconstrained, KataGo allocates NN buffers (and
# therefore every nnCache entry) sized for its 19x19 default, ~4x more
# memory per cached position than a 9x9-only board needs. requireMaxBoardSize
# is safe here specifically because every query this app ever sends
# hardcodes boardXSize/boardYSize to 9 (see GameServer's query/4) -- there
# is no other board size to ever request.
maxBoardXSizeForNNBuffer = 9
maxBoardYSizeForNNBuffer = 9
requireMaxBoardSize = true
