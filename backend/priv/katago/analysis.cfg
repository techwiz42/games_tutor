# KataGo analysis-engine config, adapted from the Phase 0 spike's
# spike_analysis.cfg (which measured real per-query latency on this
# CPU-only machine and found numAnalysisThreads=1 / 8 search threads per
# analysis fast enough with the small b6c96 net -- see docs/KATAGO_ATTRIBUTION.md
# and docs/PLAN.md's Phase 0 findings).
logDir = /tmp/katago_logs
reportAnalysisWinratesAs = SIDETOMOVE
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 8
nnMaxBatchSize = 8
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16
nnRandomize = true
