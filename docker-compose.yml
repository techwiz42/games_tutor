services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: games_tutor
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: games_tutor
    secrets:
      - postgres_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U games_tutor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: postgres
      DB_NAME: games_tutor
      DB_USER: games_tutor
      DATABASE_URL: postgresql+asyncpg://games_tutor@postgres:5432/games_tutor
      REDIS_URL: redis://redis:6379/0
      PUBLIC_BASE_URL: http://localhost:8000
      # Port 3000 is occupied by an unrelated pre-existing service on this host --
      # games_tutor's frontend uses 3020 instead (see docker-compose.yml's frontend
      # service ports mapping below; keep these two in sync).
      FRONTEND_BASE_URL: http://localhost:3020
      APP_SECRET_KEY_FILE: /run/secrets/app_secret_key
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      GOOGLE_CLIENT_ID_FILE: /run/secrets/google_client_id
      GOOGLE_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    secrets:
      - app_secret_key
      - postgres_password
      - google_client_id
      - google_client_secret
      - openai_api_key
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3020:3000"
    depends_on:
      - backend

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  app_secret_key:
    file: ./secrets/app_secret_key.txt
  google_client_id:
    file: ./secrets/google_client_id.txt
  google_client_secret:
    file: ./secrets/google_client_secret.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt

volumes:
  postgres_data:
