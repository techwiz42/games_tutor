services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: games_tutor
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: games_tutor
    secrets:
      - postgres_password
    ports:
      # Bound to loopback only -- this droplet has a public IP and nothing
      # outside this host needs direct DB access (backend reaches postgres
      # via the internal compose network regardless of this mapping; this
      # is purely for host-side access, e.g. `mix test` run outside docker).
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U games_tutor"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  redis:
    image: redis:7
    ports:
      # Loopback only -- unauthenticated Redis with no reason to be
      # internet-reachable (see postgres's port comment above).
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_NAME: games_tutor
      DB_USER: games_tutor
      REDIS_HOST: redis
      PHX_SERVER: "true"
      # Overridden with the real public domain at actual deployment time (see
      # secrets/README.md) -- these localhost defaults are for a portable
      # local dev/docker-compose setup, not this specific droplet's domain.
      PUBLIC_BASE_URL: http://localhost:8000
      # Port 3000 is occupied by an unrelated pre-existing service on this host --
      # games_tutor's frontend uses 3020 instead (see the frontend service's
      # ports mapping below; keep these two in sync).
      FRONTEND_BASE_URL: http://localhost:3020
      MAIL_FROM: pete@cyberiad.ai
      APP_SECRET_KEY_FILE: /run/secrets/app_secret_key
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      SENDGRID_API_KEY_FILE: /run/secrets/sendgrid_api_key
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
    secrets:
      - app_secret_key
      - postgres_password
      - sendgrid_api_key
      - openai_api_key
    ports:
      # Loopback only -- real traffic reaches this via nginx (TLS
      # termination) or the frontend's internal server-to-server proxy over
      # the compose network; a public 8000 would expose raw HTTP with auth
      # tokens in the clear, bypassing nginx entirely.
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # BEAM VM observed steady-state ~2.2GiB on this host; capped with headroom
    # above that rather than left unbounded (unbounded was a contributor to
    # the 2026-08-06 host-wide OOM event that also killed unrelated services).
    mem_limit: 3g

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        # Server-to-server proxy target (see frontend/next.config.ts's
        # rewrites()) -- the docker network service name, not localhost,
        # since frontend and backend are separate containers here. MUST be
        # a build arg, not a runtime `environment:` var -- next build
        # freezes rewrites() into the build output, next start never
        # re-reads it (see frontend/Dockerfile's comment).
        BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      # Loopback only -- nginx (see /etc/nginx/sites-available/games.cyberiad.ai)
      # proxies to 127.0.0.1:3020 for TLS termination; a public 3020 would
      # let anyone bypass HTTPS entirely.
      - "127.0.0.1:3020:3000"
    depends_on:
      - backend
    mem_limit: 512m

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  app_secret_key:
    file: ./secrets/app_secret_key.txt
  sendgrid_api_key:
    file: ./secrets/sendgrid_api_key.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt

volumes:
  postgres_data:
